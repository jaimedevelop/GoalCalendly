<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .background { fill: #3b82f6; }
      .text { 
        fill: white; 
        font-family: 'Arial Black', 'Impact', sans-serif;
        font-weight: 900;
        font-size: 72px;
      }
      .subtitle {
        fill: white;
        font-family: 'Arial Black', 'Impact', sans-serif;
        font-weight: 900;
        font-size: 48px;
      }
    </style>
  </defs>
  
  <!-- Background circle -->
  <rect width="512" height="512" rx="64" class="background"/>
  
  <!-- Calendar icon -->
  <g transform="translate(256, 160)">
    <rect x="-80" y="-50" width="160" height="120" fill="white" rx="8"/>
    <rect x="-70" y="-40" width="140" height="8" fill="#3b82f6"/>
    <rect x="-70" y="-30" width="140" height="70" fill="#3b82f6" opacity="0.1"/>
    <circle cx="-45" cy="0" r="8" fill="#3b82f6"/>
    <circle cx="-15" cy="0" r="8" fill="#3b82f6"/>
    <circle cx="15" cy="0" r="8" fill="#3b82f6"/>
    <circle cx="45" cy="0" r="8" fill="#3b82f6"/>
    <circle cx="-45" cy="30" r="8" fill="#3b82f6"/>
    <circle cx="-15" cy="30" r="8" fill="#3b82f6"/>
    <circle cx="15" cy="30" r="8" fill="#3b82f6"/>
    <circle cx="45" cy="30" r="8" fill="#3b82f6"/>
  </g>
  
  <!-- Text -->
  <text x="256" y="380" text-anchor="middle" class="text">Goal</text>
  <text x="256" y="440" text-anchor="middle" class="subtitle">Calendly</text>
</svg>