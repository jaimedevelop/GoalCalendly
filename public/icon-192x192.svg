<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .background { fill: #3b82f6; }
      .text { 
        fill: white; 
        font-family: 'Arial Black', 'Impact', sans-serif;
        font-weight: 900;
        font-size: 28px;
      }
      .subtitle {
        fill: white;
        font-family: 'Arial Black', 'Impact', sans-serif;
        font-weight: 900;
        font-size: 18px;
      }
    </style>
  </defs>
  
  <!-- Background circle -->
  <rect width="192" height="192" rx="24" class="background"/>
  
  <!-- Calendar icon -->
  <g transform="translate(96, 60)">
    <rect x="-32" y="-20" width="64" height="48" fill="white" rx="4"/>
    <rect x="-28" y="-16" width="56" height="3" fill="#3b82f6"/>
    <rect x="-28" y="-12" width="56" height="28" fill="#3b82f6" opacity="0.1"/>
    <circle cx="-18" cy="0" r="3" fill="#3b82f6"/>
    <circle cx="-6" cy="0" r="3" fill="#3b82f6"/>
    <circle cx="6" cy="0" r="3" fill="#3b82f6"/>
    <circle cx="18" cy="0" r="3" fill="#3b82f6"/>
    <circle cx="-18" cy="12" r="3" fill="#3b82f6"/>
    <circle cx="-6" cy="12" r="3" fill="#3b82f6"/>
    <circle cx="6" cy="12" r="3" fill="#3b82f6"/>
    <circle cx="18" cy="12" r="3" fill="#3b82f6"/>
  </g>
  
  <!-- Text -->
  <text x="96" y="140" text-anchor="middle" class="text">Goal</text>
  <text x="96" y="160" text-anchor="middle" class="subtitle">Calendly</text>
</svg>