<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goal Calendly</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#3b82f6" />
    <meta name="description" content="Track your goals and manage your time effectively with Goal Calendly" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Goal Calendly" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    
    <!-- Windows -->
    <meta name="msapplication-TileColor" content="#3b82f6" />
    <meta name="msapplication-TileImage" content="/icons/icon-192x192.png" />
    
    <!-- Splash screens -->
    <link rel="apple-touch-startup-image" href="/icons/icon-512x512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // PWA Installation Diagnostics
      console.log('\=\=\= PWA INSTALLATION DIAGNOSTICS \=\=\=');
      
      // Check manifest
      fetch('/manifest.json')
        .then(response => response.json())
        .then(manifest => {
          console.log('✓ Manifest loaded:', manifest);
          
          // Check if icons exist
          manifest.icons.forEach(icon => {
            fetch(icon.src)
              .then(response => {
                if (response.ok) {
                  console.log(`✓ Icon found: ${icon.src}`);
                } else {
                  console.error(`✗ Icon missing: ${icon.src} (Status: ${response.status})`);
                }
              })
              .catch(err => console.error(`✗ Icon fetch failed: ${icon.src}`, err));
          });
        })
        .catch(err => console.error('✗ Manifest fetch failed:', err));

      // Check PWA installation criteria
      window.addEventListener('load', () => {
        console.log('\=\=\= PWA INSTALLATION CRITERIA CHECK \=\=\=');
        console.log('HTTPS:', location.protocol === 'https:' || location.hostname === 'localhost');
        console.log('Service Worker Support:', 'serviceWorker' in navigator);
        console.log('Manifest Link:', document.querySelector('link[rel="manifest"]') ? '✓' : '✗');
        console.log('Display Mode:', window.matchMedia('(display-mode: standalone)').matches ? 'Standalone' : 'Browser');
        
        // Register service worker
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('✓ SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.error('✗ SW registration failed: ', registrationError);
            });
        }

        // Listen for beforeinstallprompt event
        window.addEventListener('beforeinstallprompt', (e) => {
          console.log('✓ beforeinstallprompt event fired - PWA is installable!');
          console.log('Install prompt event:', e);
        });

        // Check if already installed
        if (window.matchMedia('(display-mode: standalone)').matches) {
          console.log('✓ App is running in standalone mode (already installed)');
        } else {
          console.log('ℹ App is running in browser mode');
        }
      });
    </script>
  </body>
</html>
